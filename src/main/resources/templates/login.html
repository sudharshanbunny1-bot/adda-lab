<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteVault - Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; }
        .hero { width: 45%; background: #233b2e; color: #fff; padding: 80px 60px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { font-size: 22px; font-weight: bold; letter-spacing: 0.5px; }
        .tagline-sub { font-size: 13px; color: #8ba898; margin-bottom: 20px; }
        .hero h1 { font-size: 46px; font-weight: 500; line-height: 1.15; margin-bottom: 25px; }
        .hero p { font-size: 14px; color: #b7ccbf; line-line: 1.5; }
        .form-area { width: 55%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fafafa; padding: 40px; }
        .form-box { width: 100%; max-width: 360px; }
        .form-box .subhead { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 1px; font-weight: 600; }
        .form-box h2 { font-size: 28px; font-weight: 500; margin: 10px 0 25px; color: #222; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; background: #fff; }
        button { width: 100%; padding: 12px; background: #3b604b; color: #fff; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo">● NoteVault</div>
        <div>
            <div class="tagline-sub">A secure space for your thoughts & notes</div>
            <h1>Make room for what matters.</h1>
            <p>Capture thoughts. Keep ideas organized. Access your personal notes anytime, anywhere.</p>
        </div>
        <div style="font-size:12px; color:#8ba898;">● Your mind, a little less crowded.</div>
    </div>
    <div class="form-area">
        <div class="form-box">
            <div class="subhead">YOUR SECURE NOTEBOOK</div>
            <h2>Welcome back</h2>
            <form action="/login" method="post">
                <div class="form-group">
                    <label>Email address</label>
                    <input type="email" name="email" value="sudharshan@vitap.ac.in" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" value="password123" required>
                </div>
                <button type="submit">Sign in →</button>
            </form>
        </div>
    </div>
</body>
</html>
